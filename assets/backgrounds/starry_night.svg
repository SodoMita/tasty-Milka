<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="night_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a382f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c584a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Night sky -->
  <rect width="1280" height="720" fill="url(#night_sky)"/>
  
  <!-- Stars -->
  <circle cx="100" cy="80" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="120" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="60" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="600" cy="100" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="800" cy="80" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="950" cy="150" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="1100" cy="90" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="1200" cy="130" r="1" fill="#ffffff" opacity="0.7"/>
  
  <!-- Moon -->
  <circle cx="1050" cy="100" r="50" fill="#e8e4d5" opacity="0.9"/>
  <circle cx="1050" cy="100" r="50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Lake reflection -->
  <rect x="0" y="500" width="1280" height="220" fill="#2e2c25" opacity="0.6"/>
  <ellipse cx="1050" cy="620" rx="60" ry="8" fill="#e8e4d5" opacity="0.2"/>
  
  <!-- Placeholder text -->
  <text x="640" y="360" font-family="serif" font-size="32" fill="#e8e4d5" text-anchor="middle" opacity="0.6">
    [Starry Night Background]
  </text>
</svg>
