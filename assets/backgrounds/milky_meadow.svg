<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f1e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbfaf3;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sun" cx="15%" cy="15%" r="8%">
      <stop offset="0%" style="stop-color:#ffe9ad;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffe9ad;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  
  <!-- Sun glow -->
  <circle cx="192" cy="108" r="100" fill="url(#sun)"/>
  
  <!-- Rolling hills -->
  <ellipse cx="100" cy="650" rx="400" ry="200" fill="#b5b09a" opacity="0.7"/>
  <ellipse cx="1200" cy="680" rx="450" ry="220" fill="#a3a08b" opacity="0.7"/>
  <ellipse cx="600" cy="720" rx="500" ry="180" fill="#8f8b78" opacity="0.6"/>
  
  <!-- Clouds -->
  <ellipse cx="300" cy="120" rx="80" ry="30" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="800" cy="80" rx="100" ry="35" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="1100" cy="150" rx="70" ry="25" fill="#ffffff" opacity="0.35"/>
  
  <!-- Placeholder text -->
  <text x="640" y="360" font-family="serif" font-size="32" fill="#8f8b78" text-anchor="middle" opacity="0.6">
    [Milky Meadow Background]
  </text>
</svg>
