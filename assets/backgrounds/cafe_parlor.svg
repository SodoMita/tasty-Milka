<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="cafe_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6efdb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9e4d2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#cafe_bg)"/>
  
  <!-- Wainscoting -->
  <rect x="0" y="500" width="1280" height="220" fill="#7d796a"/>
  <rect x="0" y="500" width="1280" height="8" fill="#5c584a"/>
  
  <!-- Window -->
  <rect x="440" y="80" width="400" height="280" rx="40" fill="#d9d2b8" opacity="0.6" stroke="#8f8b78" stroke-width="8"/>
  <rect x="440" y="80" width="400" height="140" fill="#e8e4d5" opacity="0.4"/>
  
  <!-- Window panes -->
  <line x1="640" y1="80" x2="640" y2="360" stroke="#8f8b78" stroke-width="4"/>
  <line x1="440" y1="220" x2="840" y2="220" stroke="#8f8b78" stroke-width="4"/>
  
  <!-- Placeholder text -->
  <text x="640" y="360" font-family="serif" font-size="32" fill="#7d796a" text-anchor="middle" opacity="0.7">
    [Café Parlor Background]
  </text>
</svg>
