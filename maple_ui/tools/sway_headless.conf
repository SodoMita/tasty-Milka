# Minimal sway config for headless software rendering (WLR_RENDERER=pixman).
# No inputs, no bar, plain background — only used to give Godot a real Wayland
# surface so the milk-glass UI can be screenshotted. See tools/sway_capture.sh.
exec true
xwayland off
seat seat0 fallback true
output * bg #0d0b09 solid_color
