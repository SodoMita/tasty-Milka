name: Release

# Milka VN release pipeline (same shape as klima-gem's build/* pipeline).
#
# Pushes to a `build/*` branch (or a manual dispatch, or a `v*` tag) produce:
#   1. a Web export deployed to GitHub Pages -> https://sodomita.github.io/tasty-Milka/
#   2. the same Web export pushed to itch.io  -> https://delatel.itch.io/tasty-milka (html5 channel)
#   3. Linux + Windows desktop bundles pushed to itch.io (linux/windows channels)
#   4. a GitHub Release carrying the web zip and both desktop bundles
#
# Secrets: BUTLER_API_KEY (itch.io API key used by butler). Without it the
# itch job is skipped with a warning and the Pages + Release jobs still run.

on:
  push:
    branches: ["build/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_itch:
        description: "Push the build to itch.io"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7-stable"
  GODOT_BIN: /tmp/godot-bin/godot
  ITCH_TARGET: delatel/tasty-milka
  PAGES_URL: https://sodomita.github.io/tasty-Milka/
  ITCH_URL: https://delatel.itch.io/tasty-milka

jobs:
  build:
    name: Export web + desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot-bin/godot
            /tmp/godot-templates
          key: ${{ runner.os }}-godot-4.7-templates

      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-bin /tmp/godot-templates
          cd /tmp/godot-bin
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -oq godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          ./godot --version
          cd /tmp/godot-templates
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -oq templates.tpz
          rm -f templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -f templates/* "$TEMPLATE_DIR/"

      - name: Restore Godot from cache
        if: steps.cache-godot.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GODOT_BIN"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -f /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"
          "$GODOT_BIN" --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat version.txt 2>/dev/null || echo 0.0.0)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${BASE}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Milka VN release version: $VERSION"

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          timeout --foreground 900 "$GODOT_BIN" --headless --import

      - name: Export web bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout --foreground 900 "$GODOT_BIN" --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm

      - name: Export Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux
          timeout --foreground 900 "$GODOT_BIN" --headless --export-release "Linux" build/linux/tasty-milka.x86_64
          chmod +x build/linux/tasty-milka.x86_64 || true

      - name: Export Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          timeout --foreground 900 "$GODOT_BIN" --headless --export-release "Windows Desktop" build/windows/tasty-milka.exe

      - name: Pack web (COI service worker + version stamp)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/pack_web.sh build/web "$VERSION" "$GITHUB_SHA" "$GITHUB_REF_NAME"

      # Boots the packed web export in headless Chromium on a server WITHOUT
      # COOP/COEP headers (like GitHub Pages): the service worker must isolate
      # the page and Godot must start as a threaded build.
      - name: Web smoke test (cross-origin isolation + boot)
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_DIR=/tmp/pw node tests/web_smoke.mjs build/web /tmp/web-smoke.jpg

      - name: Upload web smoke screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshot
          path: /tmp/web-smoke.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Package artifact zips
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/tasty-milka-web-${VERSION}.zip" .)
          (cd build/linux && zip -qr "../../dist/tasty-milka-linux-${VERSION}.zip" .)
          (cd build/windows && zip -qr "../../dist/tasty-milka-windows-${VERSION}.zip" .)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist
          retention-days: 14
          if-no-files-found: error

  pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  itch:
    name: Publish to itch.io
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check butler credentials
        id: creds
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -n "${BUTLER_API_KEY:-}" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=itch.io skipped::BUTLER_API_KEY secret is not set. Add it to publish ${ITCH_URL}."
          fi

      - name: Download bundles
        if: steps.creds.outputs.have_key == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: bundles

      - name: Install butler
        if: steps.creds.outputs.have_key == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -oq butler.zip
          chmod +x butler
          ./butler -V

      - name: butler push (html5, linux, windows)
        if: steps.creds.outputs.have_key == 'true'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ./butler push bundles/web-build "${ITCH_TARGET}:html5" --userversion "${VERSION}"
          ./butler push bundles/linux-build "${ITCH_TARGET}:linux" --userversion "${VERSION}"
          ./butler push bundles/windows-build "${ITCH_TARGET}:windows" --userversion "${VERSION}"
          echo "itch.io: ${ITCH_URL} (version ${VERSION})"

  release:
    name: GitHub Release
    needs: [build, pages, itch]
    if: always() && needs.build.result == 'success' && needs.pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$(printf 'Milka VN %s\n\nPlay in the browser: %s\nitch.io: %s\n\nBuilt from %s (%s) by the release pipeline.\n' "$VERSION" "$PAGES_URL" "$ITCH_URL" "$GITHUB_SHA" "$GITHUB_REF_NAME")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip --title "Milka VN $VERSION" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi
